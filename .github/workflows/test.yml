name: Bot checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q bot.py storage.py rotation.py
      - name: Run tests
        run: python -m unittest -v test_storage.py test_bot.py test_rotation.py
